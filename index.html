<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>InnerEYE | Activities Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Website CSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

  <!-- INTERACTIVE MAP -->
  <div id="map"></div>


  <!-- INNEREYE LOGO AND BRANDING -->
  <div id="innereye-brand">

    <img
      src="./Innereye%20Logo.jpg"
      alt="InnerEYE Logo"
      id="innereye-logo"
    >

    <div class="brand-text">
      <h2>InnerEYE</h2>
      <p>Compassion | Charity | Service</p>
    </div>

  </div>


  <!-- ACTIVITY FILTER -->
  <div id="activity-filter-container">

    <label for="activity-filter">
      Explore InnerEYE Activities
    </label>

    <select id="activity-filter">

      <option value="all">
        🌍 All Activities
      </option>

      <option value="classroom-teaching">
        🏫 Classroom Teaching
      </option>

      <option value="home-for-elders">
        👴 Home for Elders
      </option>

      <option value="hunger-relief">
        🍲 Hunger Relief: Feeding Homeless
      </option>

      <option value="clothes-collection">
        👕 Clothes Collection Drive
      </option>

      <option value="vipassana">
        🧘 Vipassana Meditation
      </option>

      <option value="sanitary-pads">
        🩷 Sanitary Pads Distribution
      </option>

      <option value="miscellaneous">
        📍 Miscellaneous Events & Visits
      </option>

    </select>

  </div>


  <!-- MESSAGE WHEN CATEGORY HAS NO LOCATIONS -->
  <div id="empty-category-message" class="hidden">
    No activities recorded in this category yet.
  </div>


  <!-- SCHOOL VISIT STATUS LEGEND -->
  <div id="map-legend">

    <div class="legend-title">
      School Visit Status
    </div>

    <div class="legend-item">
      <span class="legend-dot legend-green"></span>
      <span>Visited within 30 days</span>
    </div>

    <div class="legend-item">
      <span class="legend-dot legend-yellow"></span>
      <span>Visited 31–60 days ago</span>
    </div>

    <div class="legend-item">
      <span class="legend-dot legend-red"></span>
      <span>Last visit more than 60 days ago</span>
    </div>

    <div class="legend-item">
      <span class="legend-dot legend-gray"></span>
      <span>Never visited</span>
    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- WEBSITE JAVASCRIPT -->
  <script src="./scripts.js"></script>

</body>
</html>
